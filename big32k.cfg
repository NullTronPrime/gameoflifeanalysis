# Game of Life — Massive 32K run for visual interest
# Grid: 32768 x 32768 (1.07 billion cells)
#
# Layout: guns on the left spray glider streams across a huge empty
# void into a central field of methuselahs. The gliders take ~130K gens
# to cross the grid and wrap around, creating cascading interactions.
#
# Grid size matches 32K tile rendering for seamless 1:1 pixel mapping.

grid_w          = 32768
grid_h          = 32768
max_gens        = 0
threads         = 0
rules           = B3/S23

# Seeds -- left-side gun battery (all fire right, streams flow east)
seed = gosper-gun   800  2000
seed = simkin-gun   800  5000
seed = gosper-gun   800  8000
seed = b52-bomber   800 11000
seed = gosper-gun   800 14000
seed = simkin-gun   800 17000
seed = gosper-gun   800 20000
seed = b52-bomber   800 23000
seed = gosper-gun   800 26000
seed = simkin-gun   800 29000

# Right-side guns (near edge -- their gliders wrap around quickly)
seed = gosper-gun  32000  3500
seed = gosper-gun  32000  9500
seed = simkin-gun  32000 15500
seed = gosper-gun  32000 21500
seed = simkin-gun  32000 27500

# Central methuselah field -- these bloom into complex debris that
# the glider streams eventually plow into
seed = lidka        7000  4000
seed = acorn        7000  7000
seed = r-pentomino  7000 10000
seed = lidka        7000 13000
seed = acorn        7000 16000
seed = r-pentomino  7000 19000
seed = lidka        7000 22000
seed = acorn        7000 25000
seed = r-pentomino  7000 28000

# Secondary methuselah zone (deeper in, hit later by wrapped gliders)
seed = acorn       14000  5000
seed = lidka       14000  9000
seed = r-pentomino 14000 13000
seed = acorn       14000 17000
seed = lidka       14000 21000
seed = r-pentomino 14000 25000
seed = acorn       14000 29000

# Oscillator islands (stable visual anchors)
seed = pulsar      21000  4000
seed = pulsar      21000 10000
seed = pulsar      21000 16000
seed = pulsar      21000 22000
seed = pulsar      21000 28000

# Spaceships launched from strategic positions
seed = weekender   25000  6000
seed = lwss        28000 10000
seed = glider      30000 14000
seed = weekender   25000 18000
seed = lwss        28000 22000
seed = glider      25000 26000

# Roadside attractions
seed = diehard     10000 30000
seed = diehard     20000 30000
seed = diehard     28000 30000
seed = block       30000  2000
seed = block       30000  7000
seed = block       30000 12000
seed = block       30000 17000
seed = block       30000 22000
seed = block       30000 27000

# Stagnation detection (unbounded -- catch any cycle)
stagnation          = 1
detect_extinction   = 1
detect_still        = 1
detect_cycle        = 1
cycle_window        = 0

# Archive -- every generation (sparse grid keeps frames tiny)
archive_file        = E:\DDISK\neatlogaccess\big32k.gol
resume_file         = E:\DDISK\neatlogaccess\big32k.gol
archive_every       = 1

# Stop when archive drive has <= 10 GB free (safety net)
stop_at_free_gb     = 10

# Final state snapshot
final_cells_file    = E:\DDISK\neatlogaccess\big32k_final.cells
