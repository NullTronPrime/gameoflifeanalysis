grid_w = 15000
grid_h = 15000
max_gens = 0
threads = 0
rules = B3/S23

# All 13 built-in patterns, spaced ~3000 apart on a 15000x15000 grid
seed = glider 1800 1500
seed = blinker 5400 1500
seed = block 9000 1500
seed = r-pentomino 12600 1500

seed = acorn 1800 4500
seed = pulsar 5400 4500
seed = lwss 9000 4500
seed = diehard 12600 4500

seed = gosper-gun 1800 7500
seed = simkin-gun 5400 7500
seed = lidka 9000 7500
seed = weekender 12600 7500

seed = b52-bomber 6300 10500

# Stagnation: detect all three outcomes
stag_enable = true
detect_extinction = 1
detect_still = 1
detect_cycle = 1
cycle_window = 65536

archive_file = all_patterns_15k.gol
archive_every = 100

# Compiled binary: g++ -O3 -march=native -mavx2 -fopenmp -std=c++17 -o gol gol_sim.cpp -lzstd
# Run: & "C:\msys64\usr\bin\bash.exe" -l -c "export PATH=/ucrt64/bin:\$PATH && cd 'C:/Users/ragav/OneDrive/Documents/wk2/gameoflife' && ./gol sim all_patterns_15k.cfg"
# Resume after interrupt: create resume.cfg with: max_gens=0 / resume_file=all_patterns_15k.gol
# Snapshot final state when stagnation is detected
final_cells_file = final_15k.cells
