# ── Center field — breeders, methuselahs, oscillators ──
# Quadratic growth — minimal seed that fills the universe
seed = 10cellinfinitegrowth  8192  8192

# Breeders — produce puffers which produce more gliders
seed = breeder1              7000  7000
seed = rileysbreeder         9500  9500
seed = pufferfishbreeder     7000  9500

# Methuselah clusters — chaotic blooms
seed = acorn                 8192  7000
seed = lidka                 8192  9500
seed = r-pentomino           7000  8192
seed = diehard               9500  8192

# Oscillator islands — visual anchors
seed = pulsar                6800  6800
seed = pulsar                9600  9600
seed = pulsar                6800  9600
seed = pulsar                9600  6800

# Spaceships — cross the grid and interact
seed = weekender             4000  4000
seed = weekender            12000 12000
seed = lwss                 12000  4000
seed = glider                4000 12000

