# Game of Life — Longest-run to stagnation on a 3840x2160 toroidal grid
# All 13 built-in patterns spread across 6 rows. Glider guns produce
# continuous streams that wrap the torus, cascade into methuselahs,
# spaceships, and oscillators. The resulting chaos takes the maximum
# number of generations to settle into a detectable cycle.
#
# Grid at 1:1 cell:pixel maps to a 4K (3840x2160) viewport.
#
# Grid
grid_w          = 3840
grid_h          = 2160
max_gens        = 0
threads         = 0
rules           = B3/S23

# Seeds -- all 13 built-in patterns, 3-4 per row
# Row 1  (y=180) -- glider guns producing continuous rightward streams
seed = gosper-gun   400   180
seed = simkin-gun  1400   180
seed = b52-bomber  2400   180
seed = gosper-gun  3400   180

# Row 2  (y=480) -- methuselahs (chaotic bursts, produce gliders)
seed = acorn        500   480
seed = lidka       1500   480
seed = r-pentomino 2400   480
seed = diehard     3400   480

# Row 3  (y=780) -- guns + more methuselahs
seed = simkin-gun   400   780
seed = gosper-gun  1500   780
seed = b52-bomber  2500   780
seed = acorn       3400   780

# Row 4  (y=1080) -- methuselahs + oscillator islands
seed = lidka        400  1080
seed = r-pentomino 1500  1080
seed = pulsar      2400  1080
seed = simkin-gun  3400  1080

# Row 5  (y=1380) -- deep interplay zone
seed = gosper-gun   500  1380
seed = acorn       1500  1380
seed = lidka       2500  1380
seed = r-pentomino 3400  1380

# Row 6  (y=1680) -- spaceships that travel across the grid
seed = weekender    400  1680
seed = lwss        1400  1680
seed = glider      2400  1680
seed = b52-bomber  3300  1680

# Row 7  (y=1980) -- anchor blocks + near-edge gliders for early wraps
seed = block       1000  1980
seed = block       2800  1980
seed = glider      3800   400
seed = glider      3800   900
seed = glider      3800  1500
seed = glider       100  1900

# Stagnation detection -- unbounded cycle window
stagnation          = 1
detect_extinction   = 1
detect_still        = 1
detect_cycle        = 1
cycle_window        = 0

# Archive (every generation -- full data for rendering)
archive_file        = E:\DDISK\neatlogaccess\longrun_4k.gol
archive_every       = 1

# Stop when archive drive has <= 1 GB free (avoids silent corruption)
stop_at_free_gb     = 1

# Final state snapshot at stagnation
final_cells_file    = E:\DDISK\neatlogaccess\longrun_4k_final.cells
